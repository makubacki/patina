# SPDX-License-Identifier: Apache-2.0
##
name: Patina QEMU PR Validation

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]

# Do not allow more than one instance of this workflow to run at the same
# time for the same PR branch.
concurrency:
  group: qemu-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Gather Incoming PR Metadata
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    outputs:
      pr_number: ${{ steps.pr-info.outputs.pr_number }}
    steps:
      - name: Get PR Information
        id: pr-info
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          head_sha = os.environ.get('HEAD_SHA', '')
          if not head_sha:
              raise SystemExit('HEAD_SHA is not set.')

          # Use the commits API to find the PR associated with the head SHA.
          # This is needed for PRs from forks.
          url = (
              f"https://api.github.com/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/commits/{head_sha}/pulls"
          )
          req = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
          })
          resp = json.loads(urllib.request.urlopen(req).read())
          if not resp:
              raise SystemExit(f'No PR found for commit {head_sha}.')

          pr_number = resp[0].get('number')
          if not pr_number:
              raise SystemExit('Unable to determine PR number.')

          head_ref = os.environ.get('HEAD_REF', 'N/A')
          repo_name = os.environ.get('HEAD_REPO', 'N/A')

          print('::group::PR Information')
          print(f'  - PR Number: {pr_number}')
          print(f'  - Head SHA:  {head_sha}')
          print(f'  - Head Ref:  {head_ref}')
          print(f'  - Source:    {repo_name}')
          print('::endgroup::')

          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f'pr_number={pr_number}\n')
          PY

  qemu-pr-validation:
    name: Run Patina QEMU Validation
    needs: [prepare]
    if: needs.prepare.result == 'success'
    uses: makubacki/patina-devops/.github/workflows/PatinaQemuPrValidation.yml@patina_plat_testing
    with:
      pr-number: ${{ fromJSON(needs.prepare.outputs.pr_number) }}
      patina-ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
