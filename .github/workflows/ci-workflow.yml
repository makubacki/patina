name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - major
      - skip_qemu_pr_val_on_unsupported_branches_test
      - feature/**/*
  pull_request:
    branches:
      - main
      - major
      - skip_qemu_pr_val_on_unsupported_branches_test
      - feature/**/*

# Do not allow more than one instance of this workflow to run at the same
# time for the same PR ref (branch). Prefer head_ref but fall back to ref
# for push events.
# - head_ref example: "branch_name"
# - ref example: "refs/pull/7/merge"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# NOTE: CI is temporarily disabled below. Both jobs are stubbed out to report success without
# running any real checks. Restore the reusable workflow calls (synced from patina-devops) to
# re-enable CI.
jobs:
  ci_workflow:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - name: Disabled
        run: echo "CI is temporarily disabled for testing. Reporting success without running checks."
  mdbook_docs_test:
